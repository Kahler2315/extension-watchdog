name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned extension tooling
        run: npm install

      - name: Run Mozilla linter
        run: npm run lint

      - name: Build unsigned package
        run: npm run build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: extension-watchdog-unsigned
          path: artifacts/*.zip
          if-no-files-found: error
