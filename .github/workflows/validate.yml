name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned extension tooling
        run: npm ci

      # Runs the Python static checks and the Node classifier regressions, so
      # Node has to be available before this step.
      - name: Run repository tests
        run: npm test

      - name: Run Mozilla linter
        run: npm run lint

      - name: Build unsigned package
        run: npm run build

      - name: Upload package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: extension-watchdog-unsigned
          path: artifacts/*.zip
          if-no-files-found: error
