name: Publish to Firefox Add-ons

on:
  push:
    branches:
      - amo-publish-extension-watchdog-20260731
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    environment: firefox-addons
    runs-on: ubuntu-latest
    steps:
      # This job later receives AMO signing credentials, so every action is
      # pinned to a full commit SHA instead of a movable version tag.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned extension tooling
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run Mozilla linter
        run: npm run lint

      - name: Build submitted package
        run: npm run build

      - name: Submit listed release to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir extension
          --artifacts-dir artifacts
          --channel listed
          --amo-metadata amo-metadata.json
          --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"

      - name: Upload submitted source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-watchdog-submitted-source
          path: artifacts/*.zip
          if-no-files-found: error
